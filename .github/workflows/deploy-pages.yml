name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root-base build: this is what the Chrome extension zip ships.
      - name: Build extension package
        run: |
          npm run build
          node scripts/package-extension.mjs /tmp/privacylens-extension.zip

      # Subpath build for github.io/<repo>/ hosting.
      - name: Build site for Pages
        run: PAGES_BASE=/${{ github.event.repository.name }}/ npm run build

      - name: Prepare static hosting files
        run: node scripts/postbuild-pages.mjs --zip /tmp/privacylens-extension.zip

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
