<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="../assets/gsap.min.js"></script>
<style>
  @font-face{font-family:"Grotesk";font-weight:500;src:url("../assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2")}
  @font-face{font-family:"Grotesk";font-weight:600;src:url("../assets/fonts/space-grotesk-latin-600-normal.woff2") format("woff2")}
  @font-face{font-family:"Grotesk";font-weight:700;src:url("../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:400;src:url("../assets/fonts/inter-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:500;src:url("../assets/fonts/inter-latin-500-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:600;src:url("../assets/fonts/inter-latin-600-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:700;src:url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2")}
  @font-face{font-family:"JBMono";font-weight:500;src:url("../assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2")}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .clip{position:absolute;top:0;left:0}
  .display{font-family:"Grotesk","Inter",sans-serif}
  .mono{font-family:"JBMono",monospace}
  .bg-glow{position:absolute;inset:0;background:
    radial-gradient(640px 380px at 22% 80%,rgba(7,155,142,0.30),transparent 60%),
    radial-gradient(520px 320px at 82% 16%,rgba(7,155,142,0.18),transparent 60%);}
  .brand-lockup{display:flex;align-items:center;justify-content:center;gap:22px;color:#fff}
  .brand-lockup.small{gap:16px}
  .shield{color:#079B8E;display:grid;place-items:center;background:rgba(7,155,142,0.12);
    border:2px solid rgba(7,155,142,0.5);border-radius:22px;padding:18px}
  .brand-lockup.small .shield{border-radius:14px;padding:11px}
  .wordmark{font-family:"Grotesk",sans-serif;font-size:74px;font-weight:700;letter-spacing:-0.02em}
  .brand-lockup.small .wordmark{font-size:50px}
  /* caption — TOP-LEFT so it never covers the composer / review panel / banner */
  .caption{left:80px;top:128px;bottom:auto;width:max-content;max-width:1000px;display:flex;flex-direction:column;gap:13px;
    padding:22px 28px;border-radius:20px;background:rgba(14,27,34,0.86);
    box-shadow:0 22px 55px rgba(0,0,0,0.34);border:1px solid rgba(255,255,255,0.09)}
  .caption.alert{background:rgba(120,26,14,0.88);border-color:rgba(255,170,150,0.22)}
  .cap-kicker{align-self:flex-start;font-family:"JBMono",monospace;font-weight:500;font-size:18px;
    letter-spacing:0.16em;text-transform:uppercase;color:#079B8E;padding:5px 12px;border-radius:999px;
    background:rgba(7,155,142,0.14);border:1px solid rgba(7,155,142,0.34)}
  .caption.alert .cap-kicker{color:#FF9B85;background:rgba(255,120,90,0.16);border-color:rgba(255,120,90,0.4)}
  .cap-text{font-family:"Grotesk","Inter",sans-serif;color:#fff;font-weight:600;font-size:42px;line-height:1.18;letter-spacing:-0.005em}
  /* brand chip — left:auto so .clip's left:0 doesn't stretch it */
  .chip{right:56px;left:auto;top:50px;display:flex;align-items:center;gap:11px;color:#fff;
    font-family:"Grotesk",sans-serif;padding:13px 20px;border-radius:999px;background:rgba(14,27,34,0.78);
    border:1px solid rgba(255,255,255,0.12);font-weight:600;font-size:26px;box-shadow:0 12px 30px rgba(0,0,0,0.28)}
  .chip .shield{padding:7px;border-radius:10px}
 html,body{background:linear-gradient(160deg, #0E1B22 0%, #0a151b 100%)}</style></head>
<body><div id="root" data-composition-id="card-section" data-start="0" data-duration="3" data-width="1920" data-height="1080">
<div class="bg-glow"></div>
      <div class="clip" data-start="0" data-duration="3" data-track-index="0" style="display:grid;place-items:center;width:1920px;height:1080px;color:#fff;text-align:center">
        <div>
          <div class="section-chip mono" style="display:inline-flex;align-items:center;gap:10px;color:#079B8E;font-size:21px;letter-spacing:0.12em;text-transform:uppercase;padding:10px 18px;border-radius:999px;background:rgba(7,155,142,0.12);border:1px solid rgba(7,155,142,0.4)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg> PrivacyLens Extension</div>
          <div class="section-title display" style="margin-top:30px;font-size:70px;font-weight:700;letter-spacing:-0.02em">Use it in your real AI chats</div>
          <div class="section-sub" style="margin-top:22px;font-size:28px;color:rgba(255,255,255,0.7);max-width:1200px;margin-left:auto;margin-right:auto;line-height:1.4">A Chrome extension guards ChatGPT, Claude, Gemini, Perplexity &amp; Copilot</div>
          <div class="logo-row" style="margin-top:44px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap"><span class="logo-pill" style="font-size:26px;font-weight:600;color:#fff;padding:12px 24px;border-radius:14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14)">ChatGPT</span><span class="logo-pill" style="font-size:26px;font-weight:600;color:#fff;padding:12px 24px;border-radius:14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14)">Claude</span><span class="logo-pill" style="font-size:26px;font-weight:600;color:#fff;padding:12px 24px;border-radius:14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14)">Gemini</span><span class="logo-pill" style="font-size:26px;font-weight:600;color:#fff;padding:12px 24px;border-radius:14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14)">Perplexity</span><span class="logo-pill" style="font-size:26px;font-weight:600;color:#fff;padding:12px 24px;border-radius:14px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14)">Copilot</span></div>
        </div>
      </div>
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.from(".section-chip",{y:18,opacity:0,duration:0.5,ease:"power3.out"},0.15);
tl.from(".section-title",{y:26,opacity:0,duration:0.6,ease:"power3.out"},0.35);
tl.from(".section-sub",{y:18,opacity:0,duration:0.5,ease:"power3.out"},0.6);
tl.from(".logo-pill",{y:16,opacity:0,duration:0.5,stagger:0.07,ease:"power3.out"},0.8);
tl.to("#root",{opacity:0,duration:0.4,ease:"power1.in"},2.6);
window.__timelines["card-section"]=tl;
</script></body></html>
