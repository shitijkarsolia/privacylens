<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--
      This HyperFrames project renders the PrivacyLens demo's MOTION GRAPHICS
      (title/section/outro cards + animated caption overlays) from the files in
      compositions/. The final video is assembled by scripts/build-demo-video.mjs,
      which composites those graphics over the product screen-recordings with
      ffmpeg. See ../README.md.

      index.html is a standalone title card so `hyperframes preview/lint` works.
    -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; font-weight: 700; src: url("assets/fonts/geist-sans-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 800; src: url("assets/fonts/geist-sans-latin-800-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(1200px 700px at 50% 30%, #05655C 0%, #0E1B22 60%, #060d11 100%); }
      body { font-family: "Geist", system-ui, sans-serif; }
      .clip { position: absolute; top: 0; left: 0; }
      .stage { width: 1920px; height: 1080px; display: grid; place-items: center; color: #fff; text-align: center; }
      .lock { display: flex; align-items: center; justify-content: center; gap: 22px; }
      .shield { color: #079B8E; background: rgba(7,155,142,0.12); border: 2px solid rgba(7,155,142,0.5);
        border-radius: 22px; padding: 18px; display: grid; place-items: center; }
      .wm { font-size: 76px; font-weight: 800; letter-spacing: -0.03em; }
      .tag { margin-top: 40px; font-size: 56px; font-weight: 700; letter-spacing: -0.02em; }
      .tag em { color: #079B8E; font-style: italic; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="card" class="clip stage" data-start="0" data-duration="4" data-track-index="0">
        <div>
          <div class="lock">
            <div class="shield">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <div class="wm">PrivacyLens</div>
          </div>
          <div class="tag">See what AI sees — <em>before</em> AI sees it</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".shield", { scale: 0.6, opacity: 0, duration: 0.7, ease: "back.out(1.7)" }, 0.15);
      tl.from(".wm", { y: 24, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.from(".tag", { y: 24, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.7);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
